# docker compose up -d --build   ->  http://localhost:8080  (another port: PORT=9000 docker compose up -d)
# Saved dinners and plans live in ./data on the host.
services:
  dinner-shuffle:
    image: dinner-shuffle:latest
    build:
      context: .
    container_name: dinner-shuffle
    # Run as the host user so files in ./data stay readable/editable by you (1000 = usual first Linux user).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PORT:-8080}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
